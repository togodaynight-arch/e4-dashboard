<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONT.ID - Bem-vindo!</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background: #060612;
        }

        /* Fundo gradiente animado */
        .bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at 50% 40%, #1a1a3e 0%, #0d0d22 40%, #060612 100%);
        }

        /* Canvas de partículas */
        #particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ============================================
           ESTADO IDLE - tela de espera
           ============================================ */
        .idle-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }
        .idle-container.active {
            opacity: 1;
            pointer-events: auto;
        }

        .idle-logo-ring {
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 3px solid rgba(217, 183, 89, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            animation: idlePulse 3s ease-in-out infinite;
            position: relative;
        }
        .idle-logo-ring::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1px solid rgba(217, 183, 89, 0.08);
            animation: idlePulse 3s ease-in-out infinite 0.5s;
        }
        @keyframes idlePulse {
            0%, 100% { transform: scale(1); border-color: rgba(217, 183, 89, 0.15); }
            50% { transform: scale(1.05); border-color: rgba(217, 183, 89, 0.35); }
        }

        .idle-logo-img {
            width: 80px; height: 80px;
            object-fit: contain;
            opacity: 0.6;
        }

        .idle-text {
            color: rgba(255,255,255,0.25);
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.4rem;
            text-transform: uppercase;
            text-align: center;
        }
        .idle-text-small {
            color: rgba(255,255,255,0.12);
            font-size: 0.75rem;
            margin-top: 0.5rem;
            letter-spacing: 0.2rem;
        }

        /* ============================================
           ESTADO BEM-VINDO
           ============================================ */
        .welcome-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
            transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .welcome-container.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .welcome-icon {
            width: 110px; height: 110px;
            background: linear-gradient(135deg, #d9b759 0%, #f0d878 50%, #c9a73c 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 80px rgba(217, 183, 89, 0.4), 0 0 160px rgba(217, 183, 89, 0.15);
            animation: welcomeBounce 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes welcomeBounce {
            0% { transform: scale(0); }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .welcome-title {
            color: #ffffff;
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: 0.3rem;
            animation: welcomeSlideIn 0.6s ease-out 0.2s both;
            text-shadow: 0 0 60px rgba(217, 183, 89, 0.3);
        }
        .welcome-title .highlight {
            color: #d9b759;
            text-shadow: 0 0 40px rgba(217, 183, 89, 0.6);
        }
        @keyframes welcomeSlideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-sub {
            color: rgba(255,255,255,0.4);
            font-size: 1.3rem;
            font-weight: 300;
            letter-spacing: 0.15rem;
            animation: welcomeSlideIn 0.6s ease-out 0.35s both;
        }

        /* ============================================
           ESTADO PROMOÇÕES
           ============================================ */
        .promo-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            padding: 2rem;
        }
        .promo-container.active {
            opacity: 1;
            pointer-events: auto;
        }

        .promo-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .promo-tag {
            display: inline-block;
            background: linear-gradient(135deg, #d9b759, #c9a73c);
            color: #000;
            padding: 0.5rem 2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            margin-bottom: 1rem;
            animation: promoFadeIn 0.5s ease-out;
        }
        @keyframes promoFadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .promo-title {
            color: #fff;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        .promo-subtitle {
            color: rgba(255,255,255,0.4);
            font-size: 1rem;
            font-weight: 300;
            margin-top: 0.3rem;
        }

        .promo-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            max-width: 1100px;
            width: 100%;
        }

        .promo-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(217, 183, 89, 0.15);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            min-width: 280px;
            max-width: 340px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            backdrop-filter: blur(10px);
            animation: cardSlideUp 0.5s ease-out both;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .promo-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: linear-gradient(180deg, #d9b759, transparent);
            border-radius: 4px 0 0 4px;
        }
        .promo-card:nth-child(1) { animation-delay: 0.1s; }
        .promo-card:nth-child(2) { animation-delay: 0.2s; }
        .promo-card:nth-child(3) { animation-delay: 0.3s; }
        .promo-card:nth-child(4) { animation-delay: 0.4s; }
        .promo-card:nth-child(5) { animation-delay: 0.5s; }

        @keyframes cardSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .promo-card-name {
            color: #fff;
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.3;
        }
        .promo-card-shelf {
            color: rgba(217, 183, 89, 0.7);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .promo-card-shelf::before {
            content: '';
            display: inline-block;
            width: 8px; height: 8px;
            background: #d9b759;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(217, 183, 89, 0.5);
        }
        .promo-card-prices {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            margin-top: 0.3rem;
        }
        .promo-card-old {
            color: rgba(255,255,255,0.35);
            text-decoration: line-through;
            font-size: 0.95rem;
            font-weight: 400;
        }
        .promo-card-new {
            color: #4ade80;
            font-size: 1.8rem;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
        }
        .promo-card-badge {
            position: absolute;
            top: 0.8rem; right: 0.8rem;
            background: #ef4444;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            letter-spacing: 0.05em;
        }

        .promo-empty {
            color: rgba(255,255,255,0.3);
            font-size: 1.1rem;
            font-weight: 300;
            text-align: center;
            animation: promoFadeIn 0.5s ease-out;
        }

        /* ============================================
           BARRA INFERIOR
           ============================================ */
        .status-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 10;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            padding: 0.6rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .status-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #4ade80;
            animation: dotBlink 2s infinite;
        }
        @keyframes dotBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .status-label {
            color: rgba(255,255,255,0.35);
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.05em;
        }
        .status-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .status-clock {
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
            font-weight: 400;
        }
        .status-brand {
            color: rgba(217, 183, 89, 0.4);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
        }

        /* ============================================
           RESPONSIVO
           ============================================ */
        @media (max-width: 768px) {
            .welcome-title { font-size: 2.8rem; }
            .promo-grid { gap: 1rem; }
            .promo-card { min-width: 240px; padding: 1.2rem 1.5rem; }
            .promo-card-new { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- Fundo -->
    <div class="bg"></div>
    <canvas id="particles"></canvas>

    <!-- ==================== IDLE ==================== -->
    <div class="idle-container active" id="idleContainer">
        <div class="idle-logo-ring">
            <!-- TROQUE O SRC PELA IMAGEM/LOGO DA SUA LOJA -->
            <!-- Ex: <img class="idle-logo-img" src="/logo.png" alt="Logo"> -->
            <svg width="70" height="70" viewBox="0 0 70 70" fill="none" style="opacity:0.6;">
                <rect width="70" height="70" rx="16" fill="none" stroke="rgba(217,183,89,0.25)" stroke-width="2"/>
                <path d="M20 35L28 43L50 27" stroke="#d9b759" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="idle-text">Aguardando clientes</div>
        <div class="idle-text-small">BEM-VINDO À NOSSA LOJA</div>
    </div>

    <!-- ==================== BEM-VINDO ==================== -->
    <div class="welcome-container" id="welcomeContainer">
        <div class="welcome-icon">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
        <div class="welcome-title">Seja <span class="highlight">Bem-vindo</span>!</div>
        <div class="welcome-sub">Estamos felizes em recebê-lo</div>
    </div>

    <!-- ==================== PROMOÇÕES ==================== -->
    <div class="promo-container" id="promoContainer">
        <div class="promo-header">
            <div class="promo-tag">Ofertas do Dia</div>
            <div class="promo-title">Aproveite Nossas Promoções</div>
            <div class="promo-subtitle" id="promoSubtitle">Confira os itens em destaque</div>
        </div>
        <div class="promo-grid" id="promoGrid"></div>
    </div>

    <!-- Barra inferior -->
    <div class="status-bar">
        <div class="status-left">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-label" id="statusLabel">Sistema online</span>
        </div>
        <div class="status-right">
            <span class="status-clock" id="clock">00:00</span>
            <span class="status-brand">CONT.ID</span>
        </div>
    </div>

    <script>
    (function() {
        // Elementos
        var idleContainer = document.getElementById('idleContainer');
        var welcomeContainer = document.getElementById('welcomeContainer');
        var promoContainer = document.getElementById('promoContainer');
        var promoGrid = document.getElementById('promoGrid');
        var promoSubtitle = document.getElementById('promoSubtitle');
        var statusDot = document.getElementById('statusDot');
        var statusLabel = document.getElementById('statusLabel');
        var clockEl = document.getElementById('clock');

        var audioCtx = null;
        var idleTimer = null;

        // Relógio
        function updateClock() {
            var d = new Date();
            clockEl.textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
        }
        updateClock();
        setInterval(updateClock, 15000);

        // Som de boas-vindas
        function playChime() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                var t = audioCtx.currentTime;
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523, t);
                osc.frequency.setValueAtTime(659, t + 0.1);
                osc.frequency.setValueAtTime(784, t + 0.2);
                gain.gain.setValueAtTime(0.12, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
                osc.start(t);
                osc.stop(t + 0.5);
            } catch(e) {}
        }

        // Oculta todos
        function hideAll() {
            idleContainer.classList.remove('active');
            welcomeContainer.classList.remove('active');
            promoContainer.classList.remove('active');
        }

        // Renderiza cards de promoção
        function renderPromos(promos) {
            promoGrid.innerHTML = '';
            if (!promos || promos.length === 0) {
                promoGrid.innerHTML = '<div class="promo-empty">Nenhuma promoção no momento.<br>Volte em breve!</div>';
                promoSubtitle.textContent = 'Novas ofertas em breve';
                return;
            }
            promoSubtitle.textContent = promos.length + ' itens com preços especiais';

            for (var i = 0; i < promos.length; i++) {
                var p = promos[i];
                var card = document.createElement('div');
                card.className = 'promo-card';

                var desconto = '';
                if (p.preco_normal && p.preco_promo) {
                    var normal = parseFloat((p.preco_normal || '').replace(/[^0-9,]/g, '').replace(',', '.'));
                    var promo = parseFloat((p.preco_promo || '').replace(/[^0-9,]/g, '').replace(',', '.'));
                    if (normal > 0 && promo > 0) {
                        var pct = Math.round((1 - promo / normal) * 100);
                        desconto = '<div class="promo-card-badge">-' + pct + '%</div>';
                    }
                }

                card.innerHTML =
                    desconto +
                    '<div class="promo-card-name">' + (p.nome || 'Produto') + '</div>' +
                    '<div class="promo-card-shelf">' + (p.prateleira || 'Consulte um vendedor') + '</div>' +
                    '<div class="promo-card-prices">' +
                        '<span class="promo-card-old">' + (p.preco_normal || '') + '</span>' +
                        '<span class="promo-card-new">' + (p.preco_promo || '') + '</span>' +
                    '</div>';

                promoGrid.appendChild(card);
            }
        }

        // Partículas de fundo
        function initParticles() {
            var canvas = document.getElementById('particles');
            var ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            var particles = [];
            for (var i = 0; i < 40; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.4 + 0.1,
                    opacity: Math.random() * 0.4 + 0.05
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(217, 183, 89, ' + p.opacity + ')';
                    ctx.fill();
                    p.y -= p.speed;
                    if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
                }
                requestAnimationFrame(draw);
            }
            draw();

            window.addEventListener('resize', function() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }
        initParticles();

        // Conexão SSE
        function connectSSE() {
            var es = new EventSource('/api/welcome/stream');

            es.onmessage = function(evt) {
                try {
                    var data = JSON.parse(evt.data);
                    switch (data.phase) {
                        case 'welcome':
                            if (idleTimer) clearTimeout(idleTimer);
                            hideAll();
                            welcomeContainer.classList.add('active');
                            playChime();
                            statusLabel.textContent = 'Cliente entrando';
                            break;

                        case 'promocoes':
                            hideAll();
                            renderPromos(data.promocoes || []);
                            promoContainer.classList.add('active');
                            statusLabel.textContent = 'Exibindo promoções';
                            break;

                        case 'idle':
                            hideAll();
                            idleContainer.classList.add('active');
                            statusLabel.textContent = 'Sistema online';
                            break;
                    }
                } catch(e) {}
            };

            es.onerror = function() {
                statusDot.style.background = '#ef4444';
                statusLabel.textContent = 'Reconectando...';
                es.close();
                setTimeout(connectSSE, 5000);
            };

            es.onopen = function() {
                statusDot.style.background = '#4ade80';
                statusLabel.textContent = 'Sistema online';
            };
        }

        connectSSE();

        // Clique para fullscreen
        document.addEventListener('click', function() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.documentElement.requestFullscreen().catch(function(){});
            }
        });
    })();
    </script>
</body>
</html>
