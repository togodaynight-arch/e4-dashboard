services:
  - type: web
    name: e4-dashboard
    runtime: node
    buildCommand: ""
    startCommand: node server-unificado.js
    plan: free
    envVars:
      - key: PORT
        value: "3000"

  - type: web
    name: controle-nf-boletos
    runtime: node
    buildCommand: ""
    startCommand: node nf-controle/server.js
    plan: free

  - type: web
    name: relatorios-dia
    runtime: node
    buildCommand: ""
    startCommand: node relatorios-dia/server.js
    plan: free

  - type: web
    name: boas-vindas
    runtime: node
    buildCommand: ""
    startCommand: node server-welcome.js
    plan: free
    envVars:
      - key: ADMIN_PASS
        value: togo2026
      # Adicione no painel do Render a variavel CONFIG_DB_URL com a URL do seu Firebase Realtime Database.
      # Ex: https://SEU-PROJETO-default-rtdb.firebaseio.com/
