<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To GO - Bem-vindo</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{font-family:'Montserrat',sans-serif;color:#fff;overflow:hidden;background:#060612;background:radial-gradient(ellipse at 50% 40%, #1a1a3e 0%, #0d0d22 45%, #060612 100%)}

/* ===== STAGE (rotacao) e SCALER (zoom) ===== */
.stage{position:fixed;top:0;left:0;width:100vw;height:100vh;transform-origin:top left;transition:transform .3s}
.stage.rot90{width:100vh;height:100vw;transform:translateX(100vw) rotate(90deg)}
.stage.rot180{transform:translate(100vw,100vh) rotate(180deg)}
.stage.rot270{width:100vh;height:100vw;transform:translateY(100vh) rotate(270deg)}
.scaler{position:absolute;inset:0;transform-origin:center center;transition:transform .3s}

/* ===== TELA OCIOSA ===== */
.idle{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:1;transition:opacity 0.5s}
.idle.hidden{opacity:0;pointer-events:none}
.idle-logo{font-size:var(--fs-idle-logo,60px);font-weight:900;color:#d9b759;letter-spacing:6px;margin-bottom:16px;text-transform:uppercase;text-shadow:0 0 40px rgba(217,183,89,0.25)}
.idle-text{font-size:20px;letter-spacing:5px;color:#7a86b8;text-transform:uppercase}

/* ===== PROMOÇÕES ===== */
.promo{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px;opacity:0;transition:opacity 0.6s}
.promo.show{display:flex;opacity:1}
.promo-tag{font-size:18px;letter-spacing:8px;color:var(--cor,#d9b759);text-transform:uppercase;margin-bottom:24px;font-weight:600}
.promo-titulo{font-size:var(--fs-promo-titulo,88px);font-weight:900;color:#fff;letter-spacing:2px;line-height:1.05;margin-bottom:20px;text-shadow:0 0 60px var(--cor,rgba(217,183,89,0.4))}
.promo-desc{font-size:var(--fs-promo-desc,32px);color:#c9d0ee;letter-spacing:2px;font-weight:300;max-width:80%}
.promo-glow{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(circle at 50% 35%, var(--cor,rgba(217,183,89,0.25)) 0%, transparent 55%)}

/* ===== BOAS-VINDAS ===== */
.welcome{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transform:scale(0.85);transition:all 0.7s cubic-bezier(0.175,0.885,0.32,1.275)}
.welcome.show{display:flex;opacity:1;transform:scale(1)}
.logo{font-size:var(--fs-logo,24px);font-weight:300;letter-spacing:8px;color:#d9b759;margin-bottom:40px;text-transform:uppercase}
.greeting{font-size:var(--fs-saudacao,72px);font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#d9b759,#f0d080,#d9b759);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px}
.name{font-size:var(--fs-nome,100px);font-weight:900;letter-spacing:4px;color:#fff;line-height:1.1;text-shadow:0 0 60px rgba(217,183,89,0.3);margin-bottom:16px}
.store{font-size:28px;font-weight:600;color:#d9b759;letter-spacing:4px}

/* ===== BOTAO EDITAR ===== */
.edit-btn{position:fixed;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid #333;background:rgba(20,20,35,0.85);color:#d9b759;font-size:20px;cursor:pointer;z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0.35;transition:opacity .2s}
.edit-btn:hover{opacity:1}

/* ===== PAINEL ===== */
.panel{position:fixed;top:12px;right:12px;background:rgba(18,18,32,0.97);border:1px solid #333;border-radius:12px;padding:16px;width:350px;max-height:88vh;overflow-y:auto;z-index:1001;display:none;font-size:12px}
.panel.open{display:block}
.panel h4{color:#d9b759;margin:0 0 10px;font-size:14px}
.panel label{display:block;color:#999;margin-bottom:2px;font-size:10px;text-transform:uppercase}
.panel input,.panel textarea{width:100%;padding:7px 8px;margin-bottom:10px;background:#1a1a2e;border:1px solid #333;color:#fff;border-radius:5px;font-size:12px;font-family:inherit}
.panel textarea{resize:vertical;min-height:44px}
.panel button{width:100%;padding:8px;margin:4px 0;border:none;border-radius:6px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:0.2s}
.panel button:hover{opacity:0.9}
.panel .btn-save{background:#3b82f6}
.panel .btn-simulate{background:#d9b759;color:#000}
.panel .btn-add{background:#d9b759;color:#000;font-size:11px;padding:6px;margin-bottom:8px}
.panel .btn-del{background:#333;color:#999;font-size:10px;padding:4px;width:auto}
.panel .btn-fechar{background:#444;margin-top:8px}
.panel details{margin-bottom:8px}
.panel summary{color:#d9b759;cursor:pointer;font-size:12px;font-weight:600;margin-bottom:8px}
.panel .promo-item{background:#111;padding:10px;border-radius:6px;margin-bottom:8px}
.panel .promo-item .row{display:flex;gap:6px;align-items:center}
.panel .promo-item input[type="color"]{width:40px;height:30px;padding:0;border:none;cursor:pointer;background:none;flex-shrink:0}
.panel .rot-btns{display:flex;gap:6px;margin-bottom:10px}
.panel .rot-btns button{flex:1;background:#1a1a2e;border:1px solid #333;padding:8px;font-size:12px;font-weight:700}
.panel .rot-btns button.active{background:#d9b759;color:#000;border-color:#d9b759}
.panel input[type="range"]{padding:0;margin-bottom:12px;accent-color:#d9b759;cursor:pointer}
.panel .range-val{color:#d9b759;font-weight:700}
.panel .status-bar{margin-top:10px;padding:8px;background:#111;border-radius:6px;color:#666;font-size:10px;line-height:1.6}
.panel .status-bar b{color:#10b981}
.hint{position:fixed;bottom:10px;right:10px;color:#333;font-size:10px;font-family:monospace}
</style>
</head>
<body>

<div class="stage" id="stage">
    <div class="scaler" id="scaler">
        <div class="promo-glow" id="promo-glow"></div>

        <!-- TELA OCIOSA -->
        <div class="idle" id="idle">
            <div class="idle-logo" id="idle-logo">TRANS BUS</div>
            <div class="idle-text">Aguardando clientes</div>
        </div>

        <!-- PROMOÇÕES -->
        <div class="promo" id="promo">
            <div class="promo-tag">PROMOÇÃO</div>
            <div class="promo-titulo" id="promo-titulo"></div>
            <div class="promo-desc" id="promo-desc"></div>
        </div>

        <!-- BOAS-VINDAS -->
        <div class="welcome" id="welcome">
            <div class="logo" id="store-name-display">Loja</div>
            <div class="greeting" id="greeting-display">BEM-VINDO</div>
            <div class="name" id="customer-name-display">---</div>
            <div class="store" id="customer-info-display"></div>
        </div>
    </div>
</div>

<!-- BOTAO EDITAR -->
<button class="edit-btn" id="edit-btn" onclick="abrirPanel()" title="Editar tela">⚙</button>

<!-- PAINEL DE CONFIGURAÇÃO -->
<div class="panel" id="panel">
    <h4>⚙️ Configuração</h4>

    <details open>
    <summary>🖥️ Tela</summary>
    <label>Girar tela</label>
    <div class="rot-btns" id="rot-btns">
        <button data-r="0">0°</button>
        <button data-r="90">90°</button>
        <button data-r="180">180°</button>
        <button data-r="270">270°</button>
    </div>

    <label>Zoom da tela: <span class="range-val" id="zoom-val">100%</span></label>
    <input type="range" id="cfg-zoom" min="50" max="200" value="100" oninput="setZoom(this.value)">

    <label>Letra do nome: <span class="range-val" id="fs-nome-val">100px</span></label>
    <input type="range" id="cfg-fs-nome" min="40" max="220" value="100" oninput="setFont('fsNome','fs-nome-val',this.value,'px')">

    <label>Letra da saudação: <span class="range-val" id="fs-saudacao-val">72px</span></label>
    <input type="range" id="cfg-fs-saudacao" min="30" max="180" value="72" oninput="setFont('fsSaudacao','fs-saudacao-val',this.value,'px')">

    <label>Logo (boas-vindas): <span class="range-val" id="fs-logo-val">24px</span></label>
    <input type="range" id="cfg-fs-logo" min="12" max="90" value="24" oninput="setFont('fsLogo','fs-logo-val',this.value,'px')">

    <label>Logo (espera): <span class="range-val" id="fs-idle-logo-val">60px</span></label>
    <input type="range" id="cfg-fs-idle-logo" min="20" max="160" value="60" oninput="setFont('fsIdleLogo','fs-idle-logo-val',this.value,'px')">

    <label>Título da promoção: <span class="range-val" id="fs-promo-titulo-val">88px</span></label>
    <input type="range" id="cfg-fs-promo-titulo" min="30" max="200" value="88" oninput="setFont('fsPromoTitulo','fs-promo-titulo-val',this.value,'px')">

    <label>Descrição da promoção: <span class="range-val" id="fs-promo-desc-val">32px</span></label>
    <input type="range" id="cfg-fs-promo-desc" min="14" max="110" value="32" oninput="setFont('fsPromoDesc','fs-promo-desc-val',this.value,'px')">
    </details>

    <details open>
    <summary>🏪 Loja</summary>
    <label>Nome da Loja</label>
    <input type="text" id="cfg-loja" placeholder="TRANS BUS">
    <label>Mensagem de Boas-vindas</label>
    <input type="text" id="cfg-mensagem" placeholder="BEM-VINDO">
    </details>

    <details open>
    <summary>🎁 Promoções</summary>
    <div id="promocoes-list"></div>
    <button class="btn-add" onclick="addPromocao()">+ Adicionar Promoção</button>
    </details>

    <button class="btn-save" onclick="salvarConfig()">💾 Salvar Configuração</button>

    <details open>
    <summary>🧪 Teste</summary>
    <label>Nome do cliente</label>
    <input type="text" id="sim-nome" placeholder="FULANO DE TAL">
    <button class="btn-simulate" onclick="simularEntrada()">🚶 Simular Entrada</button>
    <button class="btn-fechar" onclick="voltarIdle()" style="width:100%">🔄 Voltar ao início</button>
    </details>

    <div class="status-bar" id="status-bar">
        Cliente: <b id="sb-cliente">---</b><br>
        Última entrada: <span id="sb-entrada">---</span>
    </div>

    <button class="btn-fechar" onclick="fecharPanel()">Fechar Painel</button>
</div>

<div class="hint">Pressione <b>C</b> para abrir o painel</div>

<script>
// ========== CONFIGURAÇÃO ==========
var API_BASE = 'https://e4-dashboard-2lvk.onrender.com';

var config = {
    loja: localStorage.getItem('cfg-loja') || 'TRANS BUS',
    mensagem: localStorage.getItem('cfg-mensagem') || 'BEM-VINDO',
    promocoes: JSON.parse(localStorage.getItem('cfg-promocoes') || '[{"titulo":"OFERTA DO DIA","descricao":"Confira as novidades da nossa loja","cor":"#d9b759"},{"titulo":"ACEITAMOS PIX","descricao":"Pagamento rápido e seguro","cor":"#10b981"}]')
};

var tela = {
    rotacao: parseInt(localStorage.getItem('cfg-rotacao') || '0'),
    zoom: parseInt(localStorage.getItem('cfg-zoom') || '100'),
    fsNome: parseInt(localStorage.getItem('cfg-fs-nome') || '100'),
    fsSaudacao: parseInt(localStorage.getItem('cfg-fs-saudacao') || '72'),
    fsLogo: parseInt(localStorage.getItem('cfg-fs-logo') || '24'),
    fsIdleLogo: parseInt(localStorage.getItem('cfg-fs-idle-logo') || '60'),
    fsPromoTitulo: parseInt(localStorage.getItem('cfg-fs-promo-titulo') || '88'),
    fsPromoDesc: parseInt(localStorage.getItem('cfg-fs-promo-desc') || '32')
};

// ========== TELA (rotacao / zoom / letras) ==========
var FS_KEYS = {
    fsNome: '--fs-nome', fsSaudacao: '--fs-saudacao', fsLogo: '--fs-logo',
    fsIdleLogo: '--fs-idle-logo', fsPromoTitulo: '--fs-promo-titulo', fsPromoDesc: '--fs-promo-desc'
};

function aplicarTela() {
    var stage = document.getElementById('stage');
    stage.classList.remove('rot90','rot180','rot270');
    if (tela.rotacao === 90) stage.classList.add('rot90');
    else if (tela.rotacao === 180) stage.classList.add('rot180');
    else if (tela.rotacao === 270) stage.classList.add('rot270');

    document.getElementById('scaler').style.transform = 'scale(' + (tela.zoom/100) + ')';

    Object.keys(FS_KEYS).forEach(function(k) {
        stage.style.setProperty(FS_KEYS[k], tela[k] + 'px');
    });

    // marca botão ativo da rotação
    document.querySelectorAll('#rot-btns button').forEach(function(b) {
        b.classList.toggle('active', parseInt(b.dataset.r) === tela.rotacao);
    });
}

function setRotacao(g) { tela.rotacao = g; aplicarTela(); }
function setZoom(v) { tela.zoom = parseInt(v); document.getElementById('zoom-val').textContent = v + '%'; aplicarTela(); }
function setFont(key, valId, v, unit) {
    tela[key] = parseInt(v);
    document.getElementById(valId).textContent = v + unit;
    aplicarTela();
}

function carregarControlesTela() {
    document.getElementById('cfg-zoom').value = tela.zoom;
    document.getElementById('zoom-val').textContent = tela.zoom + '%';
    document.getElementById('cfg-fs-nome').value = tela.fsNome;
    document.getElementById('fs-nome-val').textContent = tela.fsNome + 'px';
    document.getElementById('cfg-fs-saudacao').value = tela.fsSaudacao;
    document.getElementById('fs-saudacao-val').textContent = tela.fsSaudacao + 'px';
    document.getElementById('cfg-fs-logo').value = tela.fsLogo;
    document.getElementById('fs-logo-val').textContent = tela.fsLogo + 'px';
    document.getElementById('cfg-fs-idle-logo').value = tela.fsIdleLogo;
    document.getElementById('fs-idle-logo-val').textContent = tela.fsIdleLogo + 'px';
    document.getElementById('cfg-fs-promo-titulo').value = tela.fsPromoTitulo;
    document.getElementById('fs-promo-titulo-val').textContent = tela.fsPromoTitulo + 'px';
    document.getElementById('cfg-fs-promo-desc').value = tela.fsPromoDesc;
    document.getElementById('fs-promo-desc-val').textContent = tela.fsPromoDesc + 'px';
    aplicarTela();
}

// ========== PAINEL ==========
function abrirPanel() { document.getElementById('panel').classList.add('open'); }
function fecharPanel() { document.getElementById('panel').classList.remove('open'); }
document.addEventListener('keydown', function(e) {
    // Não fecha o painel quando a pessoa está digitando num campo
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) {
        return;
    }
    if (e.key === 'c' || e.key === 'C') {
        document.getElementById('panel').classList.toggle('open');
    }
});

function salvarConfig() {
    config.loja = document.getElementById('cfg-loja').value;
    config.mensagem = document.getElementById('cfg-mensagem').value;

    var promos = [];
    document.querySelectorAll('.promo-item').forEach(function(el) {
        var t = el.querySelector('.p-titulo').value.trim();
        if (t) {
            promos.push({
                titulo: t,
                descricao: el.querySelector('.p-desc').value.trim(),
                cor: el.querySelector('.p-cor').value
            });
        }
    });
    config.promocoes = promos;

    localStorage.setItem('cfg-loja', config.loja);
    localStorage.setItem('cfg-mensagem', config.mensagem);
    localStorage.setItem('cfg-promocoes', JSON.stringify(config.promocoes));

    Object.keys(tela).forEach(function(k) { localStorage.setItem('cfg-' + k, tela[k]); });

    document.getElementById('idle-logo').textContent = config.loja;
    document.getElementById('store-name-display').textContent = config.loja;
    renderPromocoes();
    fecharPanel();
}

// ========== PROMOÇÕES (painel) ==========
function addPromocao() {
    config.promocoes.push({ titulo: '', descricao: '', cor: '#d9b759' });
    renderPromocoes();
}

function removerPromocao(idx) {
    config.promocoes.splice(idx, 1);
    renderPromocoes();
}

function escaparHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderPromocoes() {
    var el = document.getElementById('promocoes-list');
    if (!config.promocoes || config.promocoes.length === 0) {
        el.innerHTML = '<div style="color:#666;font-size:11px;margin-bottom:8px">Nenhuma promoção. Clique em "+ Adicionar Promoção".</div>';
        return;
    }
    var html = '';
    config.promocoes.forEach(function(p, i) {
        html += '<div class="promo-item">' +
            '<div class="row" style="margin-bottom:6px">' +
                '<input type="color" class="p-cor" value="' + (p.cor || '#d9b759') + '">' +
                '<input type="text" class="p-titulo" value="' + escaparHtml(p.titulo) + '" placeholder="Título" style="flex:1;margin:0">' +
                '<button class="btn-del" onclick="removerPromocao(' + i + ')">✕</button>' +
            '</div>' +
            '<textarea class="p-desc" placeholder="Descrição">' + escaparHtml(p.descricao) + '</textarea>' +
        '</div>';
    });
    el.innerHTML = html;
}

// ========== CARROSSEL DE PROMOÇÕES ==========
var promoIndex = 0;
var carouselTimer = null;
var modo = 'idle'; // 'idle' | 'promo' | 'welcome'

function proximoSlide() {
    if (modo !== 'idle' && modo !== 'promo') return;
    var promos = config.promocoes || [];
    if (promos.length === 0) { mostrarIdle(); return; }
    if (modo === 'idle') { mostrarPromo(0); promoIndex = 0; }
    else {
        promoIndex++;
        if (promoIndex >= promos.length) { mostrarIdle(); return; }
        mostrarPromo(promoIndex);
    }
}

function mostrarIdle() {
    modo = 'idle';
    document.getElementById('promo').classList.remove('show');
    document.getElementById('promo-glow').style.opacity = '0';
    document.getElementById('idle').classList.remove('hidden');
}

function mostrarPromo(i) {
    var p = config.promocoes[i];
    if (!p) { mostrarIdle(); return; }
    modo = 'promo';
    var cor = p.cor || '#d9b759';
    document.getElementById('promo-titulo').textContent = p.titulo;
    document.getElementById('promo-desc').textContent = p.descricao;
    document.getElementById('promo').style.setProperty('--cor', cor);
    document.getElementById('promo-glow').style.setProperty('--cor', cor);
    document.getElementById('promo-glow').style.opacity = '1';
    document.getElementById('idle').classList.add('hidden');
    document.getElementById('promo').classList.add('show');
}

function iniciarCarrossel() {
    if (carouselTimer) clearInterval(carouselTimer);
    carouselTimer = setInterval(proximoSlide, 6000);
}

// ========== BOAS-VINDAS ==========
var displayTimeout = null;

function formatarNome(nome) {
    if (!nome) return '';
    var partes = nome.trim().split(' ');
    if (partes.length <= 2) return nome.toUpperCase();
    return (partes[0] + ' ' + partes[partes.length - 1]).toUpperCase();
}

function mostrarBemVindo(nome) {
    modo = 'welcome';
    if (carouselTimer) clearInterval(carouselTimer);

    document.getElementById('customer-name-display').textContent = formatarNome(nome);
    document.getElementById('customer-info-display').textContent = 'Loja ' + config.loja;
    document.getElementById('store-name-display').textContent = config.loja;
    document.getElementById('greeting-display').textContent = config.mensagem;

    document.getElementById('idle').classList.add('hidden');
    document.getElementById('promo').classList.remove('show');
    document.getElementById('promo-glow').style.opacity = '0';

    document.getElementById('welcome').classList.add('show');
    document.getElementById('sb-cliente').textContent = nome;

    if (displayTimeout) clearTimeout(displayTimeout);
    displayTimeout = setTimeout(voltarIdle, 15000);
}

function voltarIdle() {
    modo = 'idle';
    document.getElementById('welcome').classList.remove('show');
    document.getElementById('idle').classList.remove('hidden');
    document.getElementById('sb-cliente').textContent = '---';
    iniciarCarrossel();
}

// ========== TESTE ==========
function simularEntrada() {
    var nome = document.getElementById('sim-nome').value.trim();
    if (!nome) {
        var nomes = ['MARIA SILVA','JOÃO SANTOS','ANA OLIVEIRA','PEDRO COSTA','CARLOS LIMA'];
        nome = nomes[Math.floor(Math.random() * nomes.length)];
    }
    document.getElementById('sim-nome').value = '';
    mostrarBemVindo(nome);
    fecharPanel();
}

// ========== ENTRADAS REAIS (via API pública) ==========
var ultimaEntradaId = null;

function verificarEntradasReais() {
    fetch(API_BASE + '/public/entrada')
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (!data.ok || !data.entrada) return;
        var e = data.entrada;
        document.getElementById('sb-entrada').textContent = e.cliente || '---';
        if (e.id !== ultimaEntradaId) {
            ultimaEntradaId = e.id;
            if (modo !== 'welcome' && e.cliente) {
                mostrarBemVindo(e.cliente);
            }
        }
    })
    .catch(function() {});
}

// ========== INICIALIZAÇÃO ==========
document.getElementById('idle-logo').textContent = config.loja;
document.getElementById('store-name-display').textContent = config.loja;

document.getElementById('cfg-loja').value = config.loja;
document.getElementById('cfg-mensagem').value = config.mensagem;
renderPromocoes();
carregarControlesTela();

mostrarIdle();
iniciarCarrossel();

// Verifica entradas reais a cada 5 segundos
setInterval(verificarEntradasReais, 5000);
</script>
</body>
</html>
